<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#731d20"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>บันทึกสาธิต</title><header><div class="mast"><div><small>PBD Smart Office</small><b>บันทึกงานสาธิต</b><span id="who"></span></div><button type="button" id="search" aria-label="ค้นหารายการ" hidden>⚲</button><button type="button" id="refresh" aria-label="รีเฟรชรายการ">⟳</button></div><nav hidden><button id="today"><i>◷</i>สาธิตวันนี้</button><button id="all"><i>☷</i>สาธิตรวม</button><button id="newBtn"><i>➤</i>ส่งสาธิต</button><button id="news"><i>♧</i>ประชาสัมพันธ์</button></nav></header><main><p id="status" role="status">กำลังเชื่อมต่อ LINE…</p><section id="app" hidden><div id="outbox" role="status"></div><label id="filter" hidden>ค้นหารายการ<input id="query" type="search" placeholder="ชื่อลูกค้า เบอร์โทร หรือสินค้า"></label><h1 id="title"></h1><form id="form" hidden><div class="staff"><label>ชื่อพนักงาน<output id="staff"></output></label><label>ทีมขาย<output id="team"></output></label></div><h2>ข้อมูลลูกค้า</h2><label>ชื่อลูกค้า<input placeholder="ระบุชื่อลูกค้า" name="customer" required maxlength="120"></label><label>เบอร์โทรศัพท์<input type="tel" inputmode="tel" pattern="0[0-9]{8,9}" placeholder="0XXXXXXXXX" name="phone" required></label><label>สินค้า<select name="product" required></select></label><label>ภาพสาธิต<input name="photo" type="file" accept="image/*" required></label><label>ปักหมุดบ้านลูกค้า</label><button type="button" id="gps">ใช้ตำแหน่งปัจจุบัน</button><div class="coords"><input name="lat" aria-label="ละติจูด" placeholder="ละติจูด" type="number" step="any" min="-90" max="90" required><input name="lng" aria-label="ลองจิจูด" placeholder="ลองจิจูด" type="number" step="any" min="-180" max="180" required></div><button class="primary">➤ ส่งรายการสาธิต</button></form><div id="list"></div><dialog id="detail"><button id="close">ปิด</button><div id="body"></div></dialog></section></main><script src="config.js"></script><script src="app.js"></script></html>
